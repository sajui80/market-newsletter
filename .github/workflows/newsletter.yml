name: Sang Joon Daily Market Newsletter

on:
  # GitHub Actions 자체 schedule(cron) 트리거는 내부 대기열 혼잡으로
  # 실제 실행이 수십 분~수 시간 지연되는 경우가 있어(2026년 기준 알려진 이슈) 사용하지 않습니다.
  # 대신 외부 스케줄러(cron-job.org 등)가 정해진 시각에 아래 workflow_dispatch를
  # GitHub API로 직접 호출하여 실행합니다. (설정 가이드 8단계 참고)
  workflow_dispatch: {}

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스레터 생성 및 발송
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python scripts/generate_newsletter.py
